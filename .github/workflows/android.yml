name: Build Safarland Alborz APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/safarland/alborz app/src/main/res/values app/src/main/res/drawable app/src/main/res/drawable-nodpi
          cp app/src/main/res/drawable-nodpi/safarland_icon.jpg app/src/main/res/drawable-nodpi/safarland_icon.jpg.tmp
          mv app/src/main/res/drawable-nodpi/safarland_icon.jpg.tmp app/src/main/res/drawable-nodpi/safarland_icon.jpg

          cat > app/src/main/res/drawable/safarland_logo.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="512dp" android:height="512dp"
              android:viewportWidth="512" android:viewportHeight="512">
              <path android:fillColor="#171717" android:pathData="M0,0h512v512h-512z"/>
              <path android:fillColor="#C6A45A" android:pathData="M256,18a238,238 0,1 0,0 476a238,238 0,1 0,0 -476M256,40a216,216 0,1 1,0 432a216,216 0,1 1,0 -432"/>
              <path android:fillColor="#C6A45A" android:pathData="M65,302L175,158l54,66 47,-56 171,190H65z"/>
              <path android:fillColor="#171717" android:pathData="M110,330L176,242l52,62 48,-57 124,83H110z"/>
              <path android:fillColor="#F8F6F0" android:pathData="M250,115L272,115 253,198 304,252 282,270 224,210z"/>
              <path android:fillColor="#C6A45A" android:pathData="M235,191L278,224 306,260 285,277 260,246 215,214z"/>
              <path android:fillColor="#F8F6F0" android:pathData="M110,352L402,352 402,370 110,370z"/>
              <path android:fillColor="#C6A45A" android:pathData="M145,382h222v16h-222z"/>
              <path android:fillColor="#C6A45A" android:pathData="M174,300h164l30,42H144z"/>
              <path android:fillColor="#171717" android:pathData="M190,309h132l18,24H172z"/>
              <path android:fillColor="#C6A45A" android:pathData="M205,344a18,18 0,1 0,36 0a18,18 0,1 0,-36 0M282,344a18,18 0,1 0,36 0a18,18 0,1 0,-36 0"/>
              <path android:fillColor="#171717" android:pathData="M213,344a10,10 0,1 0,20 0a10,10 0,1 0,-20 0M290,344a10,10 0,1 0,20 0a10,10 0,1 0,-20 0"/>
          </vector>
          XML
          cat > settings.gradle.kts <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "SafarlandAlborz"
          include(":app")
          GRADLE
          cat > build.gradle.kts <<'GRADLE'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          GRADLE
          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          PROPS
          cat > app/build.gradle.kts <<'GRADLE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.safarland.alborz"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.safarland.alborz"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.navigation:navigation-compose:2.8.5")
          }
          GRADLE
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="سفرلندالبرز" android:icon="@drawable/safarland_icon" android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML
          cat > app/src/main/java/com/safarland/alborz/MainActivity.kt <<'KOTLIN'
          package com.safarland.alborz

          import android.os.Bundle
          import android.content.Context
          import java.security.MessageDigest
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.Image
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          private val Gold = Color(0xFFC6A45A)
          private val Ink = Color(0xFF171717)
          private val Cream = Color(0xFFF8F6F0)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { SafarlandApp() }
              }
          }

          @Composable
          fun SafarlandApp() {
              val context = LocalContext.current
              val adminPrefs = remember { context.getSharedPreferences("safarland_admin", Context.MODE_PRIVATE) }
              var page by remember { mutableStateOf("passenger") }
              var adminLoggedIn by remember { mutableStateOf(false) }
              var adminUsername by remember { mutableStateOf("") }
              var adminPassword by remember { mutableStateOf("") }
              var newAdminPassword by remember { mutableStateOf("") }
              var confirmAdminPassword by remember { mutableStateOf("") }
              var adminMessage by remember { mutableStateOf("") }
              val adminPasswordConfigured = adminPrefs.contains("password_hash")
              var origin by remember { mutableStateOf("") }
              var destination by remember { mutableStateOf("") }
              var date by remember { mutableStateOf("") }
              var phone by remember { mutableStateOf("") }
              var payment by remember { mutableStateOf("نقدی") }
              var submitted by remember { mutableStateOf(false) }
              var adminPrice by remember { mutableStateOf("") }
              MaterialTheme(colorScheme = lightColorScheme(primary = Ink, secondary = Gold, background = Cream)) {
                  Column(Modifier.fillMaxSize().background(Cream).verticalScroll(rememberScrollState()).padding(20.dp)) {
                      Image(painter = painterResource(R.drawable.safarland_icon), contentDescription = "لوگوی اصلی سفرلندالبرز", modifier = Modifier.size(132.dp).align(Alignment.CenterHorizontally))
                      Spacer(Modifier.height(8.dp))
                      Text("سفرلندالبرز", fontSize = 29.sp, fontWeight = FontWeight.Bold, color = Ink, modifier = Modifier.fillMaxWidth(), textAlign = TextAlign.Center)
                      Text("تاکسی اینترنتی بین‌شهری", color = Gold, modifier = Modifier.fillMaxWidth(), textAlign = TextAlign.Center)
                      Spacer(Modifier.height(22.dp))
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          Button(onClick = { page = "passenger" }, modifier = Modifier.weight(1f), colors = ButtonDefaults.buttonColors(containerColor = if (page == "passenger") Ink else Color.LightGray)) { Text("مسافران") }
                          Button(onClick = {
                              adminUsername = ""
                              adminPassword = ""
                              adminMessage = ""
                              page = if (adminPasswordConfigured) "admin_login" else "admin_setup"
                          }, modifier = Modifier.weight(1f), colors = ButtonDefaults.buttonColors(containerColor = if (page.startsWith("admin")) Ink else Color.LightGray)) { Text("مدیریت") }
                      }
                      Spacer(Modifier.height(18.dp))
                      if (page == "passenger") {
                          Text("درخواست سفر", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Ink)
                          OutlinedTextField(origin, { origin = it }, label = { Text("مبدا") }, modifier = Modifier.fillMaxWidth())
                          OutlinedTextField(destination, { destination = it }, label = { Text("مقصد") }, modifier = Modifier.fillMaxWidth())
                          OutlinedTextField(date, { date = it }, label = { Text("تاریخ و ساعت سفر") }, modifier = Modifier.fillMaxWidth())
                          OutlinedTextField(phone, { phone = it }, label = { Text("شماره تماس") }, modifier = Modifier.fillMaxWidth())
                          Spacer(Modifier.height(10.dp))
                          Text("روش پرداخت", fontWeight = FontWeight.Bold)
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              RadioButton(payment == "نقدی", { payment = "نقدی" }); Text("نقدی")
                              Spacer(Modifier.width(18.dp))
                              RadioButton(payment == "آنلاین", { payment = "آنلاین" }); Text("آنلاین")
                          }
                          Button(onClick = { submitted = true }, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = Gold)) { Text("ثبت درخواست سفر", color = Ink) }
                          if (submitted) Text("درخواست شما در این نسخه نمایشی ثبت محلی نشده است. برای دریافت سفر، سامانه باید به سرور متصل شود.", color = Ink)
                      } else if (page == "admin_setup") {
                          Text("راه‌اندازی رمز مدیر", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Ink)
                          Text("نام کاربری مدیر: Mohammad", color = Ink)
                          OutlinedTextField(newAdminPassword, { newAdminPassword = it }, label = { Text("رمز عبور جدید (حداقل ۸ کاراکتر)") }, modifier = Modifier.fillMaxWidth())
                          OutlinedTextField(confirmAdminPassword, { confirmAdminPassword = it }, label = { Text("تکرار رمز عبور") }, modifier = Modifier.fillMaxWidth())
                          Button(onClick = {
                              if (newAdminPassword.length < 8) {
                                  adminMessage = "رمز عبور باید حداقل ۸ کاراکتر باشد."
                              } else if (newAdminPassword != confirmAdminPassword) {
                                  adminMessage = "تکرار رمز عبور مطابقت ندارد."
                              } else {
                                  val digest = MessageDigest.getInstance("SHA-256").digest(newAdminPassword.toByteArray())
                                  val hash = digest.joinToString("") { "%02x".format(it) }
                                  adminPrefs.edit().putString("password_hash", hash).apply()
                                  newAdminPassword = ""
                                  confirmAdminPassword = ""
                                  adminMessage = "رمز مدیر تنظیم شد. اکنون وارد شوید."
                                  page = "admin_login"
                              }
                          }, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = Gold)) { Text("ثبت رمز مدیر", color = Ink) }
                          if (adminMessage.isNotBlank()) Text(adminMessage, color = Ink)
                          Text("این قفل فقط روی همین گوشی ذخیره می‌شود و جایگزین احراز هویت امنِ سروری نیست.", color = Color.DarkGray, fontSize = 12.sp)
                      } else if (page == "admin_login") {
                          Text("ورود مدیر", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Ink)
                          OutlinedTextField(adminUsername, { adminUsername = it }, label = { Text("نام کاربری") }, modifier = Modifier.fillMaxWidth())
                          OutlinedTextField(adminPassword, { adminPassword = it }, label = { Text("رمز عبور") }, modifier = Modifier.fillMaxWidth())
                          Button(onClick = {
                              val digest = MessageDigest.getInstance("SHA-256").digest(adminPassword.toByteArray())
                              val hash = digest.joinToString("") { "%02x".format(it) }
                              val savedHash = adminPrefs.getString("password_hash", null)
                              if (adminUsername == "Mohammad" && savedHash != null && hash == savedHash) {
                                  adminLoggedIn = true
                                  adminPassword = ""
                                  adminMessage = ""
                                  page = "admin"
                              } else {
                                  adminMessage = "نام کاربری یا رمز عبور اشتباه است."
                              }
                          }, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = Gold)) { Text("ورود به پنل مدیریت", color = Ink) }
                          if (adminMessage.isNotBlank()) Text(adminMessage, color = Color.Red)
                      } else {
                          Text("پنل مدیریت", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Ink)
                          Text("خوش آمدید، مدیر سفرلندالبرز.", color = Ink)
                          OutlinedTextField(adminPrice, { adminPrice = it }, label = { Text("قیمت پیشنهادی سفر (تومان)") }, modifier = Modifier.fillMaxWidth())
                          Button(onClick = {
                              adminLoggedIn = false
                              page = "passenger"
                              adminPrice = ""
                          }, modifier = Modifier.fillMaxWidth()) { Text("خروج از پنل مدیریت") }
                          Text("توجه: این ورود محلی است؛ برای محافظت واقعی و مدیریت درخواست‌های سفر از چند دستگاه، اتصال به سرور لازم است.", color = Color.DarkGray, fontSize = 12.sp)
                      }
                      Spacer(Modifier.height(28.dp))
                      HorizontalDivider(color = Gold)
                      Spacer(Modifier.height(12.dp))
                      Text("راه‌های ارتباط با سفرلندالبرز", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = Ink, modifier = Modifier.fillMaxWidth(), textAlign = TextAlign.Center)
                      Spacer(Modifier.height(8.dp))
                      Text("تماس: 09059223741", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = Ink, modifier = Modifier.fillMaxWidth(), textAlign = TextAlign.Center)
                      Text("تماس: 09190476308", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = Ink, modifier = Modifier.fillMaxWidth(), textAlign = TextAlign.Center)
                      Text("وب‌سایت: safarlandalborz.com", color = Ink, modifier = Modifier.fillMaxWidth(), textAlign = TextAlign.Center)
                      Text("اینستاگرام: @safarlandalborz", color = Ink, modifier = Modifier.fillMaxWidth(), textAlign = TextAlign.Center)
                      Text("مدیریت: محمد خزائی", color = Ink, modifier = Modifier.fillMaxWidth(), textAlign = TextAlign.Center)
                      Spacer(Modifier.height(8.dp))
                      Text("سفر مطمئن، انتخاب هوشمندانه", color = Gold, modifier = Modifier.fillMaxWidth(), textAlign = TextAlign.Center)
                  }
              }
          }
          KOTLIN
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafarlandAlborz-APK
          path: app/build/outputs/apk/debug/app-debug.apk
